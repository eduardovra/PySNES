# pytest.ini
[pytest]
addopts = --showlocals
markers =
    integration: end-to-end tests requiring Mesen binary
    ppu: PPU screenshot regression tests (require reference PNGs)
    harness: smoke tests for pysnes.harness (require SMW ROM)
    xdist_group: group tests so all cases from one JSON file run on the same xdist worker (use with --dist=loadgroup)